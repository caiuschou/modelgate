[server]
host = "0.0.0.0"
port = 8000

[auth]
# Required for POST /api/v1/auth/register. Set to "" to disable self-service registration.
# Override at runtime: AUTH_INVITE_CODE
invite_code = "ZW9Z"
# Console session JWT (POST /api/v1/auth/login). Empty = derive from upstream key at startup, or set JWT_SECRET.
# jwt_secret = "your-random-secret-at-least-32-chars"

[upstream]
# OpenAI: https://api.openai.com/v1  |  OpenRouter: https://openrouter.ai/api/v1
# Override base_url with env UPSTREAM_BASE_URL on the server if needed.
base_url = "https://api.openai.com/v1"
# Upstream API key is read only from this file (not UPSTREAM_API_KEY env).
api_key = "sk-your-openai-key-here"

# Optional: 32-byte master key as 64 hex chars for BYOK (encrypt user/team upstream keys at rest).
# Env override: BYOK_MASTER_KEY. Empty = BYOK management APIs disabled; chat ignores X-MG-Byok-Id.
# [byok]
# master_key_hex = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

# Optional: rolling tracing logs (`modelgate.log.YYYY-MM-DD`). Empty = stderr only (e.g. systemd journal).
# On SSH deploy, CD sets `../shared/logs` (relative to release = persistent logs under shared/).
# Override with env TRACING_LOG_DIR if needed.
[logging]
tracing_log_dir = ""

# SQLite defaults to `modelgate.db` in the process cwd (OK for local dev).
# SSH deploy adds `[sqlite] path = "../shared/modelgate.db"` so the DB survives release switches.

