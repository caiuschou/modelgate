name: CD (SSH Deploy)

on:
  push:
    branches: ["main"]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/release/modelgate" "dist/modelgate"
          cp "config.example.toml" "dist/config.example.toml"
          tar -C dist -czf "modelgate-${GITHUB_SHA}.tar.gz" .

      - name: Upload package to server (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "modelgate-${{ github.sha }}.tar.gz"
          target: "/tmp"

      - name: Deploy on server (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          command_timeout: 10m
          request_pty: true
          script: |
            # No pipefail: pipelines with `head`/`grep` can SIGPIPE under pipefail and abort `set -e` mid-deploy.
            set -eu
            APP_NAME="modelgate"
            SERVICE_NAME="${{ secrets.SERVICE_NAME }}"
            DEPLOY_ROOT="${{ secrets.DEPLOY_ROOT }}"
            SHA="${{ github.sha }}"
            RELEASE_DIR="${DEPLOY_ROOT}/releases/${SHA}"

            mkdir -p "${DEPLOY_ROOT}/releases" "${DEPLOY_ROOT}/shared"
            mkdir -p "${DEPLOY_ROOT}/shared/logs"
            mkdir -p "${DEPLOY_ROOT}/shared/audit_logs" "${DEPLOY_ROOT}/shared/exports"
            mkdir -p "${RELEASE_DIR}"
            tar -C "${RELEASE_DIR}" -xzf "/tmp/${APP_NAME}-${SHA}.tar.gz"
            # Free /tmp (often a small tmpfs); leftover tarballs caused "No space left on device" on extract
            rm -f "/tmp/${APP_NAME}-${SHA}.tar.gz"

            # Ensure executable bit
            chmod +x "${RELEASE_DIR}/modelgate"

            # Initialize shared config once; keep it across releases
            if [ ! -f "${DEPLOY_ROOT}/shared/config.toml" ]; then
              cp "${RELEASE_DIR}/config.example.toml" "${DEPLOY_ROOT}/shared/config.toml"
            fi
            CONFIG="${DEPLOY_ROOT}/shared/config.toml"
            if [ -f "${CONFIG}" ]; then
              sed -i 's/\r$//' "${CONFIG}" || true
            fi
            # Rolling tracing logs + trace-level filter when RUST_LOG unset.
            # systemd WorkingDirectory is $DEPLOY_ROOT/current → releases/<sha>: use ../../shared/... (not ../shared/, which resolves under releases/).
            if [ -f "${CONFIG}" ]; then
              if ! grep -q '^\[logging\]' "${CONFIG}"; then
                printf '\n[logging]\ntracing_log_dir = "../../shared/logs"\ndefault_filter = "trace"\n' >> "${CONFIG}"
              else
                if grep -q 'tracing_log_dir = ""' "${CONFIG}"; then
                  sed -i 's|tracing_log_dir = ""|tracing_log_dir = "../../shared/logs"|' "${CONFIG}"
                fi
                if ! grep -qE '^default_filter[[:space:]]*=' "${CONFIG}"; then
                  sed -i '/^\[logging\]/a default_filter = "trace"' "${CONFIG}"
                fi
              fi
              # Fix older CD that wrote ../shared/ (wrong when cwd is releases/<sha>)
              sed -i 's|tracing_log_dir = "\.\./shared/|tracing_log_dir = "../../shared/|g' "${CONFIG}"
            fi
            # SQLite: default modelgate.db is per-release cwd; pin DB under shared/ so data survives deploys
            if [ -f "${CONFIG}" ] && ! grep -q '^\[sqlite\]' "${CONFIG}"; then
              printf '\n[sqlite]\npath = "../../shared/modelgate.db"\n' >> "${CONFIG}"
            fi
            if [ -f "${CONFIG}" ]; then
              sed -i 's|^path = "\.\./shared/modelgate\.db"|path = "../../shared/modelgate.db"|' "${CONFIG}"
            fi
            # Audit: list metadata is in SQLite but bodies live on disk; pin dirs under shared/ like the DB
            if [ -f "${CONFIG}" ]; then
              if ! grep -q '^\[audit\]' "${CONFIG}"; then
                printf '\n[audit]\nlog_dir = "../../shared/audit_logs"\nretention_days = 90\nbatch_size = 50\nflush_interval_seconds = 5\nexport_dir = "../../shared/exports"\n' >> "${CONFIG}"
              else
                sed -i 's|log_dir = "./audit_logs"|log_dir = "../../shared/audit_logs"|g' "${CONFIG}"
                sed -i 's|export_dir = "./exports"|export_dir = "../../shared/exports"|g' "${CONFIG}"
                sed -i 's|log_dir = "\.\./shared/audit_logs"|log_dir = "../../shared/audit_logs"|g' "${CONFIG}"
                sed -i 's|export_dir = "\.\./shared/exports"|export_dir = "../../shared/exports"|g' "${CONFIG}"
              fi
            fi
            chown -R modelgate:modelgate "${DEPLOY_ROOT}/shared/logs" "${DEPLOY_ROOT}/shared/audit_logs" "${DEPLOY_ROOT}/shared/exports" 2>/dev/null || true

            # Data was mistakenly written to $DEPLOY_ROOT/releases/shared/ when paths used ../shared/ — merge into real shared/
            RS_BUG="${DEPLOY_ROOT}/releases/shared"
            SH_OK="${DEPLOY_ROOT}/shared"
            if [ -d "${RS_BUG}" ]; then
              if [ -f "${RS_BUG}/modelgate.db" ]; then
                if [ ! -f "${SH_OK}/modelgate.db" ] || [ "${RS_BUG}/modelgate.db" -nt "${SH_OK}/modelgate.db" ]; then
                  cp -a "${RS_BUG}/modelgate.db" "${SH_OK}/modelgate.db"
                  chown modelgate:modelgate "${SH_OK}/modelgate.db" 2>/dev/null || true
                fi
              fi
              if [ -d "${RS_BUG}/audit_logs" ] && [ -n "$(ls -A "${RS_BUG}/audit_logs" 2>/dev/null)" ]; then
                mkdir -p "${SH_OK}/audit_logs"
                cp -a "${RS_BUG}/audit_logs/." "${SH_OK}/audit_logs/"
                chown -R modelgate:modelgate "${SH_OK}/audit_logs" 2>/dev/null || true
              fi
              if [ -d "${RS_BUG}/exports" ] && [ -n "$(ls -A "${RS_BUG}/exports" 2>/dev/null)" ]; then
                mkdir -p "${SH_OK}/exports"
                cp -a "${RS_BUG}/exports/." "${SH_OK}/exports/"
                chown -R modelgate:modelgate "${SH_OK}/exports" 2>/dev/null || true
              fi
              if [ -d "${RS_BUG}/logs" ] && [ -n "$(ls -A "${RS_BUG}/logs" 2>/dev/null)" ]; then
                mkdir -p "${SH_OK}/logs"
                cp -a "${RS_BUG}/logs/." "${SH_OK}/logs/"
                chown -R modelgate:modelgate "${SH_OK}/logs" 2>/dev/null || true
              fi
            fi

            ln -sfn "${DEPLOY_ROOT}/shared/config.toml" "${RELEASE_DIR}/config.toml"

            # Migrate DB from previous current release before switching symlink (first time shared DB is empty)
            SHARED_DB="${DEPLOY_ROOT}/shared/modelgate.db"
            SHARED_AUDIT="${DEPLOY_ROOT}/shared/audit_logs"
            SHARED_EXPORT="${DEPLOY_ROOT}/shared/exports"
            PREV_CURRENT=$(readlink -f "${DEPLOY_ROOT}/current" 2>/dev/null || true)
            if [ ! -f "${SHARED_DB}" ] && [ -n "${PREV_CURRENT}" ] && [ -f "${PREV_CURRENT}/modelgate.db" ]; then
              cp -a "${PREV_CURRENT}/modelgate.db" "${SHARED_DB}"
              chown modelgate:modelgate "${SHARED_DB}" 2>/dev/null || true
            fi
            # One-time copy of per-release audit body files / exports when moving to shared paths
            if [ -n "${PREV_CURRENT}" ] && [ -d "${PREV_CURRENT}/audit_logs" ]; then
              if [ -z "$(ls -A "${SHARED_AUDIT}" 2>/dev/null)" ]; then
                cp -a "${PREV_CURRENT}/audit_logs/." "${SHARED_AUDIT}/"
                chown -R modelgate:modelgate "${SHARED_AUDIT}" 2>/dev/null || true
              fi
            fi
            if [ -n "${PREV_CURRENT}" ] && [ -d "${PREV_CURRENT}/exports" ]; then
              if [ -z "$(ls -A "${SHARED_EXPORT}" 2>/dev/null)" ]; then
                cp -a "${PREV_CURRENT}/exports/." "${SHARED_EXPORT}/"
                chown -R modelgate:modelgate "${SHARED_EXPORT}" 2>/dev/null || true
              fi
            fi

            # Point "current" to this release
            ln -sfn "${RELEASE_DIR}" "${DEPLOY_ROOT}/current"

            # Restart service
            systemctl daemon-reload || true
            if ! systemctl restart "${SERVICE_NAME}"; then
              echo "systemctl restart failed: ${SERVICE_NAME}" >&2
              journalctl -u "${SERVICE_NAME}" -n 80 --no-pager || true
              systemctl --no-pager --full status "${SERVICE_NAME}" || true
              exit 1
            fi

            # Fixed loopback probe — same as `curl http://localhost:8000/healthz` on the host (default [server] port).
            HEALTHCHECK_URL="http://127.0.0.1:8000/healthz"

            # Optional var or secret SKIP_HEALTHCHECK=true only while debugging (see journalctl on the server).
            if [ "${{ vars.SKIP_HEALTHCHECK || secrets.SKIP_HEALTHCHECK }}" = "true" ]; then
              echo "SKIP_HEALTHCHECK=true — skipping HTTP probe (remove secret when service is healthy)" >&2
              exit 0
            fi

            _n=0
            while [ "${_n}" -lt 45 ]; do
              if curl -fsS --noproxy '*' --connect-timeout 2 "${HEALTHCHECK_URL}" >/dev/null 2>&1; then
                exit 0
              fi
              _n=$((_n + 1))
              sleep 1
            done
            echo "Health check failed: ${HEALTHCHECK_URL}" >&2
            journalctl -u "${SERVICE_NAME}" -n 80 --no-pager || true
            systemctl --no-pager --full status "${SERVICE_NAME}" || true
            exit 1

